name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  ONESIGNAL_DISABLE_LOCATION: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: student
            id: com.b12.student
            label: B12
          - name: admin
            id: com.b12.admin
            label: B12Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web app
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @onesignal/capacitor-plugin esbuild
          mkdir www
          cp ../${{ matrix.name }}.html www/index.html
          cp ../${{ matrix.name }}-manifest.json www/
          cp ../${{ matrix.name }}-*.png www/
          cp ../sw.js www/
          cat > os-entry.js <<'JS'
          import OneSignal from '@onesignal/capacitor-plugin';
          window.B12OS = { init: function (id) { OneSignal.initialize(id); return OneSignal.Notifications.requestPermission(false); } };
          JS
          npx esbuild os-entry.js --bundle --format=iife --outfile=www/os.js
          printf '%s' '{"appId":"${{ matrix.id }}","appName":"${{ matrix.label }}","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
      - name: Add Android
        working-directory: app
        run: |
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n <application#' android/app/src/main/AndroidManifest.xml
      - name: Icons
        continue-on-error: true
        working-directory: app
        run: |
          R=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert ../${{ matrix.name }}-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
          done
          rm -rf $R/mipmap-anydpi-v26
      - name: Sync and build
        working-directory: app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalRelease
      - name: Sign APK
        working-directory: app/android/app/build/outputs/apk/release
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > $RUNNER_TEMP/b12.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/b12.p12 --ks-pass env:KS_PASS --ks-key-alias b12 --out app-signed.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: B12-${{ matrix.name }}-APK
          path: app/android/app/build/outputs/apk/release/app-signed.apk
