<!DOCTYPE html><html lang="ar" dir="rtl"><head><title>B12 الإدارة</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#0a1628;--c:#12233d;--c2:#183050;--t:#eaf2fb;--m:#8fa6c2;--p:#19c3b1;--a:#3b82f6;--b:#24405f;box-sizing:border-box}
@media(prefers-color-scheme:light){:root{--bg:#eef3f9;--c:#fff;--c2:#e6eef8;--t:#0d2038;--m:#5b6f88;--b:#d3deec}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,Tahoma,sans-serif}
.w{max-width:620px;margin:auto;padding:14px 14px 90px}
.hero{background:linear-gradient(135deg,#0e7c8f,#1d4ed8);border-radius:18px;padding:18px;color:#fff;overflow:hidden}.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 0;opacity:.85;font-size:13px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0;animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.it{display:flex;gap:12px;align-items:center;cursor:pointer}.n{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;border-radius:12px;min-width:38px;height:38px;display:grid;place-items:center;font-weight:800}.m{color:var(--m);font-size:13px}
input,textarea,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--b);border-radius:10px;background:var(--c2);color:var(--t);font:inherit}
button{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;margin:4px 0}button.g{background:none;color:var(--p);border:1px solid var(--p)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;z-index:5}.nav button{flex:1;background:none;color:var(--m);border-radius:0;margin:0;padding:12px 4px;font-size:12px}.nav button.on{color:var(--p)}
pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;line-height:1.7}.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--c2);display:grid;place-items:center}
.ecg{width:100%;height:60px}.ecg path{stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:600;stroke-dashoffset:600;animation:d 2.6s linear infinite}@keyframes d{to{stroke-dashoffset:-600}}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lb{width:100%;max-width:380px;text-align:center}
.logo{width:84px;height:84px;margin:auto;border-radius:24px;background:linear-gradient(135deg,var(--p),var(--a));display:grid;place-items:center;font-size:42px;color:#fff;animation:pulse 1.8s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #19c3b180}50%{box-shadow:0 0 0 18px #19c3b100}}
.err{color:#ff6b6b;font-size:13px;min-height:18px}.tag{display:inline-block;background:var(--c2);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--p)}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;margin:6px 0;background:var(--c2)}.bub.me{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;margin-inline-start:auto}
#sp{position:fixed;inset:0;background:#0b2a4a;z-index:100;display:grid;place-items:center;transition:opacity .6s}#sp svg{width:100%;max-width:440px}
.ban{border-radius:22px;overflow:hidden;margin:12px 0}.ban svg{display:block;width:100%}.emp{text-align:center;padding:10px 0}.emp svg{width:100%;max-width:320px}
body.busy::after{content:'🚑';position:fixed;top:6px;font-size:26px;z-index:70;animation:drive 1.6s linear infinite}@keyframes drive{from{left:-40px}to{left:100%}}
.w>*{animation:up .45s both}.w>*:nth-child(2){animation-delay:.07s}.w>*:nth-child(3){animation-delay:.14s}.w>*:nth-child(4){animation-delay:.21s}.w>*:nth-child(n+5){animation-delay:.28s}
.nav button.on span{animation:pop .45s}@keyframes pop{50%{transform:translateY(-7px) scale(1.25)}}.sr:not(.add){background-size:250% 250%;animation:sh 3s ease infinite}@keyframes sh{50%{background-position:100% 50%}}
.b{animation:pp .25s both}@keyframes pp{from{transform:scale(.9);opacity:0}}.card.it:hover{transform:translateY(-2px)}.hero{box-shadow:0 8px 24px #0e7c8f55}

<g><animateTransform attributeName="transform" type="translate" from="-130 0" to="400 0" dur="5s" repeatCount="indefinite"/><rect x="0" y="306" width="74" height="44" rx="4" fill="#fff"/><path d="M74 322h22l14 14v14H74z" fill="#fff"/><path d="M80 326h14l9 10H80z" fill="#8fd3ff"/><rect x="0" y="336" width="110" height="6" fill="#12b5a6"/><rect x="40" y="311" width="6" height="18" fill="#e5484d"/><rect x="34" y="317" width="18" height="6" fill="#e5484d"/><rect x="6" y="312" width="18" height="14" rx="2" fill="#8fd3ff"/><circle cx="12" cy="318" r="3.2" fill="#f1c9a5"/><rect x="9" y="322" width="13" height="3" rx="1.5" fill="#c7d2fe"/><rect x="36" y="300" width="13" height="6" rx="2" fill="#ff3b3b"><animate attributeName="fill" values="#ff3b3b;#2b7fff;#ff3b3b" dur=".5s" repeatCount="indefinite"/></rect><rect x="49" y="300" width="13" height="6" rx="2" fill="#2b7fff"><animate attributeName="fill" values="#2b7fff;#ff3b3b;#2b7fff" dur=".5s" repeatCount="indefinite"/></rect>
<circle cx="22" cy="350" r="8" fill="#161616"/><circle cx="22" cy="350" r="3" fill="#9aa5b1"/><line x1="22" y1="344" x2="22" y2="356" stroke="#9aa5b1" stroke-width="1.5"><animateTransform attributeName="transform" type="rotate" from="0 22 350" to="360 22 350" dur=".5s" repeatCount="indefinite"/></line><circle cx="88" cy="350" r="8" fill="#161616"/><circle cx="88" cy="350" r="3" fill="#9aa5b1"/><line x1="88" y1="344" x2="88" y2="356" stroke="#9aa5b1" stroke-width="1.5"><animateTransform attributeName="transform" type="rotate" from="0 88 350" to="360 88 350" dur=".5s" repeatCount="indefinite"/></line></g>

import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,deleteDoc,query,orderBy,limit}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const app0=initializeApp({apiKey:"AIzaSyAdq7CDSqQ7depq4z04rIe23fnkZkn8qcY",authDomain:"batch-12-fb6bb.firebaseapp.com",projectId:"batch-12-fb6bb",storageBucket:"batch-12-fb6bb.firebasestorage.app",messagingSenderId:"395362401804",appId:"1:395362401804:web:8c4a1d22723370a3ef7829"});
const db=getFirestore(app0),auth=getAuth(app0);
const rows=async c=>(await getDocs(collection(db,c))).docs.map(d=>({id:+d.id||d.id,...d.data()}));
const byNum=(x,y)=>(x.num||0)-(y.num||0);
const $=i=>document.getElementById(i),A=$('app'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const ECG='<svg class="ecg" viewBox="0 0 600 60"><path d="M0 30h150l15-22 20 44 20-40 15 18h380"/></svg>';
let ok=false,tab='st',err='',ST=[],SU=[],LE=[],CH=[],st='';
function init(){onAuthStateChanged(auth,async u=>{ok=!!u;if(ok)await load();draw()})}
let NE=[];
async function load(){document.body.classList.add('busy');try{ST=(await rows('students')).map(x=>({...x,uid:x.id}));SU=(await rows('subjects')).sort(byNum);LE=(await rows('lectures')).sort(byNum);NE=(await rows('news')).sort((x,y)=>y.t-x.t);const r=await getDocs(query(collection(db,'messages'),orderBy('t','desc'),limit(60)));CH=r.docs.map(d=>d.data()).reverse()}catch(e){alert(e.message)}document.body.classList.remove('busy')}
function login(){A.innerHTML='<div class="lg"><div class="lb"><div class="logo">✚</div><h1 style="margin:18px 0 2px">B12 تمريض</h1><p class="m">لوحة الإدارة</p><div class="card"><input id="em" type="email" placeholder="الإيميل"><input id="pw" type="password" placeholder="كلمة المرور"><div class="err">'+err+'</div><button style="width:100%" onclick="lg()">دخول</button></div></div></div>'}
async function lg(){try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){err='خطأ: '+(e.code||e.message);login()}}
const up=f=>new Promise(res=>{if(!f)return res('');const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.src=URL.createObjectURL(f)});
async function act(p){try{await p}catch(e){alert(e.message)}await load();draw()}
async function addT(){const u=$('si').value.trim(),n=$('sn').value.trim();if(!u||!n)return;const ex=ST.find(x=>x.id===u)||{},pid=ex.pid||Math.random().toString(36).slice(2,10),ph=(await up($('sp').files[0]))||ex.photo_url||'';act(Promise.all([setDoc(doc(db,'students',u),{name:n,photo_url:ph,pid}),setDoc(doc(db,'directory',pid),{name:n,photo_url:ph})]))}
async function addN(){const ti=$('nt').value.trim();if(!ti)return;const f=$('nf').files[0];let img='';if(f)img=await new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.65))};im.src=URL.createObjectURL(f)});act(addDoc(collection(db,'news'),{title:ti,body:$('nb').value,img,t:Date.now()}))}
function addS(){const n=$('bn').value.trim();if(!n)return;act(setDoc(doc(db,'subjects',String(Date.now())),{num:+$('bm').value||SU.length+1,name:n,doctor:$('bd').value}))}
async function addL(){const t=$('lt').value.trim();if(!t||!$('ls').value)return;act(setDoc(doc(db,'lectures',String(Date.now())),{subject_id:+$('ls').value,num:+$('ln').value||1,title:t,sheet_url:$('lf').value.trim(),summary:$('lu').value,questions:$('lq').value}))}
const del=(t,k,v)=>{if(!confirm('تأكيد الحذف؟'))return;const s=t==='students'?ST.find(x=>x.id===String(v)):null;act(Promise.all([deleteDoc(doc(db,t,String(v))),...(s&&s.pid?[deleteDoc(doc(db,'directory',s.pid))]:[])]))};const setTab=k=>{tab=k;draw()};
async function send(){const t=$('tx').value.trim();if(t)act(addDoc(collection(db,'messages'),{sender:'الإدارة',body:t,t:Date.now()}))}
function draw(){if(!ok)return login();let h='<div class="w"><div class="hero">'+ECG+'<h1>لوحة الإدارة</h1><p>'+ST.length+' طالب · '+SU.length+' مادة · '+LE.length+' محاضرة</p></div>';
if(tab==='st'){h+='<div class="card"><b>إضافة طالب</b><input id="sn" placeholder="اسم الطالب كاملاً"><input id="si" placeholder="الرقم الجامعي"><input id="sp" type="file" accept="image/*"><div class="m" id="st"></div><button onclick="addT()">إضافة</button></div>';ST.forEach(s=>h+='<div class="card it">'+(s.photo_url?'<img class="av" src="'+esc(s.photo_url)+'">':'<span class="av">👤</span>')+'<div style="flex:1"><b>'+esc(s.name)+'</b><div class="m">'+esc(s.uid)+'</div></div><button class="g" onclick="del(\'students\',\'uid\',\''+esc(s.uid)+'\')">حذف</button></div>')}
if(tab==='su'){h+='<div class="card"><b>إضافة مادة</b><input id="bm" type="number" placeholder="رقم المادة"><input id="bn" placeholder="اسم المادة"><input id="bd" placeholder="اسم الدكتور"><button onclick="addS()">إضافة</button></div>';SU.forEach(s=>h+='<div class="card it"><span class="n">'+s.num+'</span><div style="flex:1"><b>'+esc(s.name)+'</b><div class="m">'+esc(s.doctor)+'</div></div><button class="g" onclick="del(\'subjects\',\'id\','+s.id+')">حذف</button></div>')}
if(tab==='le'){h+='<div class="card"><b>إضافة محاضرة</b><select id="ls">'+SU.map(s=>'<option value="'+s.id+'">'+s.num+'. '+esc(s.name)+'</option>').join('')+'</select><input id="ln" type="number" placeholder="رقم المحاضرة"><input id="lt" placeholder="عنوان المحاضرة"><input id="lf" placeholder="رابط الشيت (Google Drive)"><textarea id="lu" rows="3" placeholder="الملخص"></textarea><textarea id="lq" rows="3" placeholder="الأسئلة"></textarea><div class="m" id="st"></div><button onclick="addL()">حفظ</button></div>';LE.forEach(l=>h+='<div class="card it"><span class="n">'+l.num+'</span><div style="flex:1"><b>'+esc(l.title)+'</b><div class="m">'+esc((SU.find(s=>s.id===l.subject_id)||{}).name)+'</div></div><button class="g" onclick="del(\'lectures\',\'id\','+l.id+')">حذف</button></div>')}
if(tab==='nw'){h+='<div class="card"><b>نشر خبر</b><input id="nt" placeholder="عنوان الخبر"><textarea id="nb" rows="4" placeholder="نص الخبر"></textarea><input id="nf" type="file" accept="image/*"><button onclick="addN()">نشر</button></div>';NE.forEach(n=>h+='<div class="card it"><div style="flex:1"><b>'+esc(n.title)+'</b><div class="m">'+new Date(n.t).toLocaleDateString()+'</div></div><button class="g" onclick="del(\'news\',\'id\',\''+n.id+'\')">حذف</button></div>')}
if(tab==='ch'){h+='<h3>النقاش</h3>';CH.forEach(c=>h+='<div class="bub '+(c.sender==='الإدارة'?'me':'')+'"><div style="font-size:12px;opacity:.7">'+esc(c.sender)+'</div>'+esc(c.body)+'</div>');h+='<textarea id="tx" rows="2" placeholder="اكتب رسالة..."></textarea><button onclick="send()">إرسال</button>'}
h+='</div><div class="nav">'+[['st','الطلاب','🎓'],['su','المواد','📚'],['le','المحاضرات','📄'],['nw','الأخبار','📰'],['ch','النقاش','💬']].map(([k,t,e])=>'<button class="'+(tab===k?'on':'')+'" onclick="setTab(\''+k+'\')">'+e+'<br>'+t+'</button>').join('')+'</div>';A.innerHTML=h}
init();setTimeout(()=>{const x=$('sp');if(x){x.style.opacity=0;setTimeout(()=>x.remove(),700)}},3000);Object.assign(window,{addN,lg,addT,addS,addL,del,send,setTab});</script></body></html>
