<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>B12 تمريض</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e7c8f">
<style>
:root{--bg:#f1f6fb;--c:#fff;--c2:#e7eff8;--t:#0d2038;--m:#62758d;--p:#12b5a6;--a:#3b82f6;--b:#d9e3ef;--fs:16px;--ff:system-ui,Tahoma,sans-serif}
[data-th=dark]{--bg:#09131f;--c:#12233d;--c2:#1a3050;--t:#eaf2fb;--m:#8fa6c2;--b:#24405f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--t);font-family:var(--ff);font-size:var(--fs)}
.w{max-width:620px;margin:auto;padding:12px 12px 92px}.m{color:var(--m);font-size:.82em}h3{margin:16px 4px 6px}
.hero{background:linear-gradient(135deg,#0e7c8f,#1d4ed8);border-radius:20px;padding:16px;color:#fff;overflow:hidden;display:flex;gap:12px;align-items:center}.hero h1{margin:0;font-size:1.2em}.hero p{margin:3px 0 0;opacity:.85;font-size:.8em}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:12px;margin:10px 0;animation:up .35s both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.it{display:flex;gap:12px;align-items:center;cursor:pointer}.it:active{transform:scale(.98)}
.n{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;border-radius:13px;min-width:40px;height:40px;display:grid;place-items:center;font-weight:800}
input,textarea,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--b);border-radius:12px;background:var(--c2);color:var(--t);font:inherit}
button{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;margin:4px 0}button.g{background:none;color:var(--p);border:1px solid var(--p)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom,0)}.nav button{flex:1;background:none;color:var(--m);border-radius:0;margin:0;padding:10px 2px;font-size:.7em;font-weight:600}.nav button.on{color:var(--p)}.nav span{font-size:1.5em;display:block}
pre{white-space:pre-wrap;font:inherit;margin:6px 0;line-height:1.7}.av{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--c2);display:grid;place-items:center;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.ecg{width:100%;height:50px;margin-bottom:-6px}.ecg path{stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:600;stroke-dashoffset:600;animation:d 2.6s linear infinite}@keyframes d{to{stroke-dashoffset:-600}}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#12507a44,transparent 50%),var(--bg)}.lb{width:100%;max-width:380px;text-align:center}
.logo{width:84px;height:84px;margin:auto;border-radius:26px;background:linear-gradient(135deg,var(--p),var(--a));display:grid;place-items:center;font-size:42px;color:#fff;animation:pulse 1.8s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #12b5a680}50%{box-shadow:0 0 0 18px #12b5a600}}
.err{color:#ff6b6b;font-size:.85em;min-height:18px}.tag{display:inline-block;background:var(--c2);border-radius:20px;padding:3px 10px;font-size:.8em;color:var(--p)}
.srow{display:flex;gap:12px;overflow-x:auto;padding:6px 2px}.sc{text-align:center;width:68px;flex:none;cursor:pointer}.sc small{display:block;margin-top:4px;font-size:.72em;overflow:hidden;white-space:nowrap}
.sr{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#12b5a6,#3b82f6,#8b5cf6);position:relative}.sr .av{width:100%;height:100%;border:3px solid var(--bg)}.sr.add{background:var(--b)}.sr i{position:absolute;bottom:-2px;right:-2px;background:var(--p);color:#fff;width:22px;height:22px;border-radius:50%;font-style:normal;display:grid;place-items:center}
#sv{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center}#sv>img{max-width:100%;max-height:100%}
.svp{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}.svp b{flex:1;height:3px;background:#fff5;border-radius:3px;overflow:hidden}.svp b.d{background:#fff}.svp b.a::after{content:'';display:block;height:100%;background:#fff;animation:pr 5s linear}@keyframes pr{from{width:0}to{width:100%}}
.svh{position:absolute;top:22px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff}.svh button{background:none;padding:0;margin:0;font-size:22px}.svc{position:absolute;bottom:30px;left:0;right:0;text-align:center;color:#fff;padding:0 20px;text-shadow:0 1px 4px #000}.svl,.svr{position:absolute;top:60px;bottom:80px;width:40%}.svl{left:0}.svr{right:0}
.cw{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:calc(58px + env(safe-area-inset-bottom,0))}
.ch{background:linear-gradient(135deg,#0e7c8f,#1d4ed8);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}.ib{background:none;color:inherit;border:0;padding:6px 9px;margin:0;font-size:1.3em;cursor:pointer;display:inline-block}
.ms{flex:1;overflow-y:auto;padding:10px}.b{max-width:80%;padding:7px 10px;border-radius:14px 14px 14px 4px;margin:4px 0;background:var(--c);width:fit-content;box-shadow:0 1px 2px #0002;word-break:break-word}.b.me{margin-inline-start:auto;background:#d4f5ef;color:#0d2038;border-radius:14px 14px 4px 14px}
[data-th=dark] .b.me{background:#0f5f66;color:#fff}.b img{max-width:100%;border-radius:10px;display:block}.b audio{max-width:210px;height:38px}.sn{font-size:.72em;color:var(--p);font-weight:700}.tm{font-size:.62em;opacity:.6;text-align:end;margin-top:2px}.stc{font-size:3em;line-height:1.1}
.ib2{display:flex;align-items:flex-end;gap:2px;background:var(--c);padding:6px;border-top:1px solid var(--b)}.ib2 textarea{margin:0;border-radius:20px;max-height:90px;flex:1}.ib2 .ib{color:var(--m)}.snd{border-radius:50%;width:42px;height:42px;padding:0;margin:0 2px}.ib.rec{color:#e11!important;animation:pulse2 1s infinite}@keyframes pulse2{50%{opacity:.3}}
.stk{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--c);max-height:150px;overflow-y:auto;border-top:1px solid var(--b)}.stk span{font-size:2em;padding:3px 6px;cursor:pointer}
.nw img{width:100%;border-radius:12px;margin-top:6px}.nh{display:flex;gap:10px;align-items:center;margin-bottom:8px}.logo2{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));color:#fff;display:grid;place-items:center}
.wps{display:flex;gap:8px;flex-wrap:wrap}.wps div{width:48px;height:48px;border-radius:12px;border:3px solid transparent;cursor:pointer}.wps div.on{border-color:var(--p)}
#zm{position:fixed;inset:0;background:#000d;z-index:60;display:grid;place-items:center}#zm img{max-width:96%;max-height:96%}
</style></head><body><div id="app"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getFirestore,collection,doc,getDoc,getDocs,addDoc,updateDoc,query,orderBy,limit,where}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app0=initializeApp({apiKey:"AIzaSyAdq7CDSqQ7depq4z04rIe23fnkZkn8qcY",authDomain:"batch-12-fb6bb.firebaseapp.com",projectId:"batch-12-fb6bb",storageBucket:"batch-12-fb6bb.firebasestorage.app",messagingSenderId:"395362401804",appId:"1:395362401804:web:8c4a1d22723370a3ef7829"});
const db=getFirestore(app0),$=i=>document.getElementById(i),A=$('app'),day=864e5;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rows=async c=>(await getDocs(collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const D={ar:{home:'المواد',news:'الأخبار',st:'الحالات',chat:'الدردشة',set:'الإعدادات',hi:'أهلاً',nm:'الاسم كاملاً',id:'الرقم الجامعي',go:'دخول',bad:'الرقم الجامعي غير مسجّل لدى الإدارة',nc:'خطأ في الاتصال',need:'اكتب الاسم والرقم الجامعي',sheet:'شيت المحاضرة',open:'فتح الشيت',sum:'الملخص',q:'الأسئلة',back:'رجوع',group:'الدردشة العامة',gsub:'كل الدفعة',search:'ابحث عن زميل...',type:'اكتب رسالة...',mys:'حالتي',nos:'لا توجد حالات في آخر 24 ساعة',cap:'اكتب تعليقاً (اختياري)',adm:'الإدارة',lang:'اللغة',th:'المظهر',auto:'تلقائي',light:'فاتح',dark:'داكن',fs:'حجم الخط',ff:'نوع الخط',wp:'خلفية الدردشة',photo:'تغيير صورة البروفايل',out:'تسجيل خروج',nonews:'لا توجد أخبار',nopid:'اطلب من الإدارة إعادة إضافتك لتفعيل الرسائل الخاصة',nosub:'لا توجد مواد بعد',ph:'اختر صورة',mic:'لا يمكن استخدام الميكروفون'},en:{home:'Subjects',news:'News',st:'Status',chat:'Chats',set:'Settings',hi:'Hello',nm:'Full name',id:'University ID',go:'Enter',bad:'This ID is not registered by the admin',nc:'Connection error',need:'Enter name and university ID',sheet:'Lecture sheet',open:'Open sheet',sum:'Summary',q:'Questions',back:'Back',group:'Class chat',gsub:'Everyone',search:'Search classmates...',type:'Type a message...',mys:'My status',nos:'No status in the last 24h',cap:'Caption (optional)',adm:'Admin',lang:'Language',th:'Theme',auto:'Auto',light:'Light',dark:'Dark',fs:'Font size',ff:'Font',wp:'Chat wallpaper',photo:'Change profile photo',out:'Log out',nonews:'No news yet',nopid:'Ask the admin to re-add you to enable private chats',nosub:'No subjects yet',ph:'Pick a photo',mic:'Microphone unavailable'}};
const FF={sys:'system-ui,Tahoma,sans-serif',serif:'Georgia,"Times New Roman",serif',mono:'ui-monospace,Menlo,monospace',round:'"Trebuchet MS",Verdana,sans-serif'};
const W=['linear-gradient(160deg,#e6f7f5,#dbeafe)','linear-gradient(160deg,#0b1d33,#12385a)','radial-gradient(circle at 20% 20%,#bff3ec,transparent 40%),linear-gradient(#eaf4ff,#dff3ef)','linear-gradient(160deg,#1e293b,#0f766e)','linear-gradient(160deg,#fff7ed,#e0f2fe)','#09131f'];
const STK=['😀','😂','🥹','😍','😎','🤓','😴','🤒','😷','🤕','🥶','🤯','👍','👏','🙏','💪','🔥','🎉','❤️','💉','🩺','💊','🩹','🩸','🧪','🧬','🫀','🧠','🫁','🦷','🏥','🚑','👩‍⚕️','👨‍⚕️','📚','✅','⭐','😅','🙌','🤝'];
let cfg={lang:'ar',th:'auto',fs:16,ff:'sys',wp:0},wpImg='',me=null,S=[],L=[],N=[],ST=[],DIR=[],v={p:'home'},err='',busy=false,lastK='',rc=null,rt=null,chunks=[],svq=[],svi=0,svt=null,cq='';
try{cfg={...cfg,...JSON.parse(localStorage.getItem('b12cfg'))};wpImg=localStorage.getItem('b12wp')||'';me=JSON.parse(localStorage.getItem('b12me'))}catch(e){}
const t=k=>(D[cfg.lang]||D.ar)[k]||k,save=()=>{try{localStorage.setItem('b12cfg',JSON.stringify(cfg))}catch(e){}};
function apply(){const r=document.documentElement,dk=cfg.th==='dark'||(cfg.th==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);r.dir=cfg.lang==='ar'?'rtl':'ltr';r.lang=cfg.lang;r.dataset.th=dk?'dark':'light';r.style.setProperty('--fs',cfg.fs+'px');r.style.setProperty('--ff',FF[cfg.ff]||FF.sys)}
const wpCss=()=>cfg.wp==='img'&&wpImg?`url(${wpImg}) center/cover`:W[cfg.wp]||W[0];
const shrink=(f,mx,q)=>new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};im.src=URL.createObjectURL(f)});
const ECG='<svg class="ecg" viewBox="0 0 600 60"><path d="M0 30h150l15-22 20 44 20-40 15 18h380"/></svg>';
const avh=(p,cls='')=>`<span class="av ${cls}">${p?`<img src="${p}">`:'👤'}</span>`;
async function loadAll(){try{[S,L,N,ST,DIR]=await Promise.all(['subjects','lectures','news','stories','directory'].map(rows));S.sort((a,b)=>a.num-b.num);L.sort((a,b)=>a.num-b.num);N.sort((a,b)=>b.t-a.t)}catch(e){}}
function login(){A.innerHTML=`<div class="lg"><div class="lb"><div class="logo">✚</div><h1 style="margin:18px 0 2px">B12 تمريض</h1><div class="card"><input id="nm" placeholder="${t('nm')}"><input id="id" inputmode="numeric" placeholder="${t('id')}"><div class="err">${err}</div><button style="width:100%" onclick="reg()">${busy?'...':t('go')}</button></div></div></div>`}
async function reg(){const u=$('id').value.trim(),n=$('nm').value.trim();if(!u||!n){err=t('need');return login()}busy=true;login();let r;try{r=await getDoc(doc(db,'students',u))}catch(e){busy=false;err=t('nc')+': '+(e.code||'');return login()}busy=false;if(!r.exists()){err=t('bad');return login()}const x=r.data();me={n:x.name||n,u,pid:x.pid||'',ph:x.photo_url||''};try{localStorage.setItem('b12me',JSON.stringify(me))}catch(e){}err='';await loadAll();draw()}
function go(p,a,b){clearTimeout(svt);if(p==='chat')v={p,m:a,c:b};else if(p==='sub')v={p,s:a};else if(p==='lec')v={p,l:a,s:b};else v={p};lastK='';draw();scrollTo(0,0);if(['news','st','chat','home'].includes(p)&&!a)loadAll().then(()=>{if(v.p===p&&!v.m)draw()})}
const nav=()=>`<div class="nav">${[['home','📚'],['news','📰'],['st','🟢'],['chat','💬'],['set','⚙️']].map(([k,e])=>`<button class="${v.p===k?'on':''}" onclick="go('${k}')"><span>${e}</span>${t(k)}</button>`).join('')}</div>`;
function draw(){if(!me)return login();apply();const p=v.p;if(p==='chat'&&v.m)return drawChat();let h='<div class="w">';
 if(p!=='set'&&p!=='chat')h+=`<div class="hero">${avh(me.ph)}<div style="flex:1">${ECG}<h1>${t('hi')} ${esc(me.n.split(' ')[0])}</h1><p>B12 تمريض</p></div></div>`;
 if(p==='home'){h+=`<h3>${t('home')}</h3>`+S.map(s=>`<div class="card it" onclick="go('sub','${s.id}')"><span class="n">${s.num}</span><div><b>${esc(s.name)}</b><div class="m">${esc(s.doctor)}</div></div></div>`).join('')+(S.length?'':`<p class="m">${t('nosub')}</p>`)}
 if(p==='sub'){const s=S.find(x=>x.id===v.s)||{};h+=`<button class="g" onclick="go('home')">${t('back')}</button><h3>${esc(s.name)}</h3><span class="tag">${esc(s.doctor)}</span>`+L.filter(l=>String(l.subject_id)===v.s).map(l=>`<div class="card it" onclick="go('lec','${l.id}','${v.s}')"><span class="n">${l.num}</span><b>${esc(l.title)}</b></div>`).join('')}
 if(p==='lec'){const l=L.find(x=>x.id===v.l)||{};h+=`<button class="g" onclick="go('sub','${v.s}')">${t('back')}</button><h3>${esc(l.title)}</h3>`+(l.sheet_url?`<div class="card"><b>📄 ${t('sheet')}</b><br><a href="${esc(l.sheet_url)}" target="_blank"><button>${t('open')}</button></a></div>`:'')+`<div class="card"><b>📝 ${t('sum')}</b><pre>${esc(l.summary)}</pre></div><div class="card"><b>❓ ${t('q')}</b><pre>${esc(l.questions)}</pre></div>`}
 if(p==='news'){h+=`<h3>${t('news')}</h3>`+N.map(n=>`<div class="card nw"><div class="nh"><span class="logo2">✚</span><div><b>B12 ${t('adm')}</b><div class="m">${new Date(n.t).toLocaleDateString(cfg.lang)}</div></div></div><b>${esc(n.title)}</b><pre>${esc(n.body)}</pre>${n.img?`<img src="${n.img}" onclick="zoom(this.src)">`:''}</div>`).join('')+(N.length?'':`<p class="m">${t('nonews')}</p>`)}
 if(p==='st'){const live=ST.filter(s=>Date.now()-s.t<day),by={};live.sort((a,b)=>a.t-b.t).forEach(s=>(by[s.pid]=by[s.pid]||[]).push(s));h+=`<h3>${t('st')}</h3><div class="srow"><div class="sc" onclick="document.getElementById('sf').click()"><div class="sr add">${avh(me.ph)}<i>+</i></div><small>${t('mys')}</small></div><input id="sf" type="file" accept="image/*" hidden onchange="addStory(this.files[0])">`+Object.entries(by).map(([k,a])=>`<div class="sc" onclick="openSt('${esc(k)}')"><div class="sr">${avh(a[0].ph)}</div><small>${esc(a[0].name.split(' ')[0])}</small></div>`).join('')+`</div>`+(live.length?'':`<p class="m">${t('nos')}</p>`)}
 if(p==='chat'){h+=`<h3>${t('chat')}</h3><div class="card it" onclick="go('chat','g')"><span class="n">👥</span><div><b>${t('group')}</b><div class="m">${t('gsub')}</div></div></div><input placeholder="${t('search')}" value="${esc(cq)}" oninput="filt(this.value)"><div id="cl">${contacts()}</div>`}
 if(p==='set')h+=settings();
 A.innerHTML=h+'</div>'+nav()}
const contacts=()=>{const l=DIR.filter(x=>x.id!==me.pid&&(x.name||'').toLowerCase().includes(cq.toLowerCase()));return (me.pid?'':`<p class="m">${t('nopid')}</p>`)+l.map(x=>`<div class="card it" onclick="${me.pid?`go('chat','p','${x.id}')`:''}">${avh(x.photo_url)}<b>${esc(x.name)}</b></div>`).join('')};
function filt(q){cq=q;$('cl').innerHTML=contacts()}
function settings(){const o=(k,a)=>a.map(([x,n])=>`<option value="${x}" ${String(cfg[k])===x?'selected':''}>${n}</option>`).join('');return `<h3>${t('set')}</h3><div class="card it">${avh(me.ph)}<div><b>${esc(me.n)}</b><div class="m">${esc(me.u)}</div></div></div><input id="pf" type="file" accept="image/*" hidden onchange="setPhoto(this.files[0])"><button onclick="document.getElementById('pf').click()">📷 ${t('photo')}</button>
<div class="card"><b>${t('lang')}</b><select onchange="setC('lang',this.value)">${o('lang',[['ar','العربية'],['en','English']])}</select><b>${t('th')}</b><select onchange="setC('th',this.value)">${o('th',[['auto',t('auto')],['light',t('light')],['dark',t('dark')]])}</select><b>${t('fs')}: ${cfg.fs}</b><input type="range" min="13" max="22" value="${cfg.fs}" onchange="setC('fs',+this.value)"><b>${t('ff')}</b><select onchange="setC('ff',this.value)">${o('ff',[['sys','Default'],['serif','Serif'],['mono','Mono'],['round','Rounded']])}</select></div>
<div class="card"><b>${t('wp')}</b><div class="wps">${W.map((w,i)=>`<div class="${cfg.wp===i?'on':''}" style="background:${w}" onclick="setC('wp',${i})"></div>`).join('')}<div class="${cfg.wp==='img'?'on':''}" style="background:var(--c2);display:grid;place-items:center" onclick="document.getElementById('wf').click()">🖼️</div></div><input id="wf" type="file" accept="image/*" hidden onchange="setWp(this.files[0])"></div><button class="g" onclick="out()">${t('out')}</button>`}
function setC(k,x){cfg[k]=x;save();draw()}
async function setWp(f){if(!f)return;wpImg=await shrink(f,900,.6);try{localStorage.setItem('b12wp',wpImg)}catch(e){}setC('wp','img')}
function out(){me=null;try{localStorage.removeItem('b12me')}catch(e){}login()}
async function setPhoto(f){if(!f)return;const p=await shrink(f,160,.7);try{await updateDoc(doc(db,'students',me.u),{photo_url:p});if(me.pid)await updateDoc(doc(db,'directory',me.pid),{photo_url:p});me.ph=p;try{localStorage.setItem('b12me',JSON.stringify(me))}catch(e){}draw()}catch(e){alert((e.code||e.message))}}
async function addStory(f){if(!f)return;const img=await shrink(f,800,.6),cap=prompt(t('cap'))||'';try{await addDoc(collection(db,'stories'),{pid:me.pid||me.n,name:me.n,ph:me.ph||'',img,cap,t:Date.now()});await loadAll();draw()}catch(e){alert(e.code||e.message)}}
function openSt(k){svq=ST.filter(s=>Date.now()-s.t<day&&s.pid===k).sort((a,b)=>a.t-b.t);svi=0;showSt()}
function showSt(){clearTimeout(svt);let o=$('sv');if(!svq[svi]){if(o)o.remove();return}const s=svq[svi];if(!o){o=document.createElement('div');o.id='sv';document.body.appendChild(o)}o.innerHTML=`<div class="svp">${svq.map((_,i)=>`<b class="${i<svi?'d':i===svi?'a':''}"></b>`).join('')}</div><div class="svh"><span>${esc(s.name)}</span><button onclick="stGo(1e9)">✕</button></div><img src="${s.img}"><div class="svc">${esc(s.cap)}</div><div class="svl" onclick="stGo(-1)"></div><div class="svr" onclick="stGo(1)"></div>`;svt=setTimeout(()=>stGo(1),5000)}
function stGo(d){svi=d===1e9?d:Math.max(0,svi+d);showSt()}
function zoom(s){const o=document.createElement('div');o.id='zm';o.innerHTML=`<img src="${s}">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
function drawChat(){const dm=v.m==='p',pe=dm&&DIR.find(x=>x.id===v.c);A.innerHTML=`<div class="cw" style="background:${wpCss()}"><div class="ch"><button class="ib" style="color:#fff" onclick="go('chat')">${cfg.lang==='ar'?'›':'‹'}</button>${dm?avh(pe?.photo_url):'<span class="av">👥</span>'}<b>${dm?esc(pe?.name):t('group')}</b></div><div id="msgs" class="ms"></div><div id="stk" class="stk" style="display:none">${STK.map(s=>`<span onclick="sendMsg({st:'${s}'})">${s}</span>`).join('')}</div><div class="ib2"><button class="ib" onclick="tog()">😊</button><label class="ib">📎<input type="file" accept="image/*" hidden onchange="sendImg(this.files[0])"></label><textarea id="tx" rows="1" placeholder="${t('type')}"></textarea><button class="ib" id="mic" onclick="mic()">🎤</button><button class="snd" onclick="sendMsg()">➤</button></div></div>`+nav();refreshMsgs(true)}
const tog=()=>{const s=$('stk');s.style.display=s.style.display==='none'?'flex':'none'};
const bub=m=>{const mine=m.sid?m.sid===me.pid:m.sender===me.n,tm=new Date(m.t||0).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return `<div class="b ${mine?'me':''}">${v.m==='g'&&!mine?`<div class="sn">${esc(m.sender)}</div>`:''}${m.st?`<div class="stc">${m.st}</div>`:''}${m.img?`<img src="${m.img}" onclick="zoom(this.src)">`:''}${m.aud?`<audio controls src="${m.aud}"></audio>`:''}${m.body?`<div>${esc(m.body)}</div>`:''}<div class="tm">${tm}${mine?' ✓✓':''}</div></div>`};
async function refreshMsgs(first){if(v.p!=='chat'||!v.m)return;try{let m;if(v.m==='g'){m=(await getDocs(query(collection(db,'messages'),orderBy('t','desc'),limit(60)))).docs.map(d=>d.data()).reverse()}else{const cid=[me.pid,v.c].sort().join('_');m=(await getDocs(query(collection(db,'dms'),where('cid','==',cid)))).docs.map(d=>d.data()).sort((a,b)=>a.t-b.t).slice(-80)}const k=m.length+':'+(m.length?m[m.length-1].t:0);if(!first&&k===lastK)return;lastK=k;const el=$('msgs');if(!el)return;const near=first||el.scrollHeight-el.scrollTop-el.clientHeight<140;el.innerHTML=m.map(bub).join('');if(near)el.scrollTop=el.scrollHeight}catch(e){}}
async function sendMsg(x={}){const tx=$('tx'),body=tx?tx.value.trim():'';if(!body&&!x.st&&!x.img&&!x.aud)return;if(v.m==='p'&&!me.pid)return alert(t('nopid'));const d={sender:me.n,sid:me.pid||'',body,t:Date.now(),...x};if(v.m==='p'){d.cid=[me.pid,v.c].sort().join('_');d.to=v.c}try{await addDoc(collection(db,v.m==='g'?'messages':'dms'),d);if(tx)tx.value='';if(x.st)tog();refreshMsgs(true)}catch(e){alert(e.code||e.message)}}
async function sendImg(f){if(f)sendMsg({img:await shrink(f,900,.6)})}
async function mic(){const b=$('mic');if(rc){rc.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rc=new MediaRecorder(s);chunks=[];rc.ondataavailable=e=>chunks.push(e.data);rc.onstop=()=>{s.getTracks().forEach(x=>x.stop());clearTimeout(rt);const bl=new Blob(chunks,{type:rc.mimeType});rc=null;b.classList.remove('rec');if(bl.size>600000)return alert('Too long');const f=new FileReader();f.onload=()=>sendMsg({aud:f.result});f.readAsDataURL(bl)};rc.start();b.classList.add('rec');rt=setTimeout(()=>rc&&rc.stop(),40000)}catch(e){alert(t('mic'))}}
apply();if(me)loadAll().then(draw);draw();setInterval(()=>refreshMsgs(),4000);
Object.assign(window,{$,reg,go,out,filt,setC,setWp,setPhoto,addStory,openSt,stGo,zoom,tog,sendMsg,sendImg,mic});
</script></body></html>
