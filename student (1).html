function labCalc(){const g=i=>parseFloat(((document.getElementById(i))||{}).value);const vol=g('lb1'),hrs=g('lb2'),df=g('lb3'),w=g('lb4'),mkg=g('lb5'),conc=g('lb6');const o=[];

let __gs=null,__lp=false;
const __bubbleOf=el=>el&&el.closest?el.closest('.b[data-i]'):null;
